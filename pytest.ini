[pytest]
# Home Assistant tests (pytest-homeassistant-custom-component). The two
# script-style checks (test_speaker_state_map.py, test_serial_link_sim.py)
# run on their own with plain python3 and are not collected here.
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --ignore=tests/test_speaker_state_map.py --ignore=tests/test_serial_link_sim.py
